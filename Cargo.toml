[package]
name = "stars"
version = "0.1.4"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Hertzsprung-Russell diagram explorer: prominent stars, their properties and evolutionary tracks, in the terminal. Part of the Fe2O3 suite, built on crust."
license = "Unlicense"
repository = "https://github.com/isene/stars"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls", "json"] }

[profile.release]
opt-level = 3
lto = true
strip = true
